name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev,plot]"
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff-report.txt
      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.python-version }}
          path: ruff-report.txt
      - name: Test core package
        run: pytest --cov=fast_ballmapper --cov-report=term-missing

  optional-cpu-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional CPU backends
        run: python -m pip install -e ".[dev,plot,faiss,hnswlib]"
      - name: Run backend and integration tests
        run: pytest tests/test_faiss_integration.py tests/test_optional_backend_adapters.py tests/test_backend_interface.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
