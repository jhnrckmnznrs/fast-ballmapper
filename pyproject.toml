[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-ballmapper"
version = "0.2.0"
description = "Auditable Ball Mapper construction with exact and approximate range-query backends"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "John Rick Dolor Manzanares" },
  { name = "Jay-Anne Baga Bulauan" },
]
keywords = [
  "ball-mapper",
  "topological-data-analysis",
  "point-cloud",
  "range-query",
  "networkx",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "networkx>=3.0",
  "numpy>=1.23",
  "scikit-learn>=1.2",
  "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/jhnrckmnznrs/fast-ballmapper"
Repository = "https://github.com/jhnrckmnznrs/fast-ballmapper"
Issues = "https://github.com/jhnrckmnznrs/fast-ballmapper/issues"
Changelog = "https://github.com/jhnrckmnznrs/fast-ballmapper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.4"]
faiss-gpu = [
    "faiss-gpu",
]
hnswlib = ["hnswlib>=0.8"]
cuvs-cu12 = ["cuvs-cu12; python_version >= '3.11'", "cupy-cuda12x; python_version >= '3.11'"]
cuvs-cu13 = ["cuvs-cu13; python_version >= '3.11'", "cupy-cuda13x; python_version >= '3.11'"]
plot = [
  "matplotlib>=3.7",
  "plotly>=5.0",
]
all = [
  "faiss-cpu>=1.7.4",
  "hnswlib>=0.8",
  "matplotlib>=3.7",
  "plotly>=5.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fast_ballmapper = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "UP"]
